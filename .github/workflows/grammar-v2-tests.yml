name: Grammar v2 tests

on:
  pull_request:
    branches:
      - phase-2-layout-generation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grammar-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"

      - name: Compile Grammar v2 modules
        run: python -m compileall -q .

      - name: Run complete test suite
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log

      - name: Generate corridor variation review
        run: python generate_corridor_variation_review.py

      - name: Upload corridor variation review
        uses: actions/upload-artifact@v4
        with:
          name: corridor-variations-review-${{ github.run_id }}
          path: corridor-variations-review.txt
          retention-days: 7

      - name: Upload pytest log after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: pytest.log
          if-no-files-found: ignore
          retention-days: 7
