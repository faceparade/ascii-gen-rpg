[project]
name = "modular-ascii-dungeon"
version = "0.1.0"
description = "Byte-locked modular ASCII dungeon grammar and layout tools"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
norecursedirs = [".git", ".hermes", ".pytest_cache", "__pycache__", "_archive", "references"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["_archive", "references"]
